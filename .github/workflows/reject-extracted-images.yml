name: Reject extracted images

# Reject image extraction using comments (/reject <keys>) or PR closure

on:
    issue_comment:
        types: [created]
    pull_request:
        types: [closed]

permissions:
    contents: write # Push reverts to the PR branch
    pull-requests: write # Reply and react

# Queue rejects per PR so concurrent comments don't race the push
concurrency:
    group: reject-images-${{ github.event.issue.number || github.event.pull_request.number }}
    cancel-in-progress: false

jobs:
    reject:
        # Owner's /reject on a PR (branch verified in resolve, issue_comment fires on plain issues too)
        if: >-
            github.event_name == 'issue_comment'
            && startsWith(github.event.comment.body, '/reject')
            && github.event.comment.author_association == 'OWNER'
            && github.event.issue.pull_request
        runs-on: ubuntu-latest
        steps:
            - name: Resolve PR and target paths
              id: resolve
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ github.event.issue.number }}
                  COMMENT_BODY: ${{ github.event.comment.body }}
              run: |
                  pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
                  head_ref=$(jq -r '.head.ref' <<<"$pr")
                  if [ "$(jq -r '.state' <<<"$pr")" != open ] || [[ "$head_ref" != extract-image-set/* ]]; then
                      echo "Not an open extract PR ($head_ref), ignoring"
                      exit 0
                  fi
                  gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' > "$RUNNER_TEMP/changed.txt"

                  err() { echo "error=$1" >> "$GITHUB_OUTPUT"; exit 0; }
                  # Tokens from the comment's first line, expanded against the PR's changed files
                  read -ra tokens <<<"$(head -n1 <<<"$COMMENT_BODY" | sed 's|^/reject||')"
                  [ ${#tokens[@]} -gt 0 ] || err 'Usage: `/reject <keys>`, e.g. `/reject 13 17:figure G:diagram`'
                  : > "$RUNNER_TEMP/targets.txt"
                  missed=()
                  for token in "${tokens[@]}"; do
                      [[ "$token" =~ ^([A-Za-z0-9_-]+)(:(figures?|fig|f|diagram|d))?$ ]] || { missed+=("$token"); continue; }
                      # Bare key hits both files, :figure/:fig/:f only the figures sibling, :diagram/:d only the named card
                      case "${BASH_REMATCH[3]}" in
                          fig*|f) sub='figures/';;
                          '') sub='(figures/)?';;
                          *) sub='';;
                      esac
                      grep -E "^assets/diagrams/[^/]+/Axis/$sub${BASH_REMATCH[1]}\.webp$" "$RUNNER_TEMP/changed.txt" >> "$RUNNER_TEMP/targets.txt" || missed+=("$token")
                  done
                  [ ${#missed[@]} -eq 0 ] || err "No changed Axis image for: ${missed[*]}. Nothing reverted"
                  {
                      echo "head_ref=$head_ref"
                      echo "label=${tokens[*]}"
                      echo 'targets<<EOF'
                      sort -u "$RUNNER_TEMP/targets.txt"
                      echo EOF
                  } >> "$GITHUB_OUTPUT"

            - uses: actions/checkout@v5
              if: steps.resolve.outputs.targets != ''
              with:
                  ref: ${{ steps.resolve.outputs.head_ref }}

            - name: Revert rejected images to main
              id: revert
              if: steps.resolve.outputs.targets != ''
              env:
                  TARGETS: ${{ steps.resolve.outputs.targets }}
              run: |
                  git fetch --depth=1 origin main
                  while IFS= read -r p; do
                      if git cat-file -e "origin/main:$p" 2>/dev/null; then
                          git checkout origin/main -- "$p" # Revert (also restores a pool-drop deletion)
                      else
                          git rm -q --ignore-unmatch -- "$p" # Key new in this PR, rejecting drops the file
                      fi
                  done <<<"$TARGETS"
                  echo "changed=$(git status --porcelain | grep -q . && echo true || echo false)" >> "$GITHUB_OUTPUT"
                  # Only block (numbered) images feed panel cuts
                  echo "disciplines=$(grep -E '/(figures/)?[0-9][^/]*\.webp$' <<<"$TARGETS" | cut -d/ -f3 | sort -u | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

            - uses: actions/setup-python@v6
              if: steps.revert.outputs.changed == 'true' && steps.revert.outputs.disciplines != ''
              with:
                  python-version: '3.12'

            - name: Re-measure panel cuts
              if: steps.revert.outputs.changed == 'true' && steps.revert.outputs.disciplines != ''
              run: |
                  pip install numpy pillow
                  python3 tools/panel-cuts/measure.py ${{ steps.revert.outputs.disciplines }}

            - name: Commit and push the rejection
              if: steps.revert.outputs.changed == 'true'
              env:
                  LABEL: ${{ steps.resolve.outputs.label }}
                  HEAD_REF: ${{ steps.resolve.outputs.head_ref }}
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email 'github-actions[bot]@users.noreply.github.com'
                  git add -A -- assets/diagrams
                  git commit -m "chore: Reject Axis re-cut of $LABEL"
                  git push origin "HEAD:refs/heads/$HEAD_REF"

            - name: Reply and react
              if: steps.resolve.outputs.targets != '' || steps.resolve.outputs.error != ''
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ github.event.issue.number }}
                  COMMENT_ID: ${{ github.event.comment.id }}
                  ERROR: ${{ steps.resolve.outputs.error }}
                  TARGETS: ${{ steps.resolve.outputs.targets }}
                  CHANGED: ${{ steps.revert.outputs.changed }}
              run: |
                  if [ -n "$ERROR" ]; then
                      gh pr comment "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --body "$ERROR"
                      exit 0
                  fi
                  if [ "$CHANGED" = true ]; then
                      body=$(printf 'Reverted to `main`:\n%s' "$(sed 's|^|- `|; s|$|`|' <<<"$TARGETS")")
                  else
                      body='Nothing to revert, target images already match `main`'
                  fi
                  gh pr comment "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --body "$body"
                  gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content='+1'

    cleanup:
        # Repo auto-delete only covers merged PRs. Closing (rejecting) leaves a stale branch
        if: >-
            github.event_name == 'pull_request'
            && !github.event.pull_request.merged
            && startsWith(github.event.pull_request.head.ref, 'extract-image-set/')
        runs-on: ubuntu-latest
        steps:
            - name: Delete branch
              env:
                  GH_TOKEN: ${{ github.token }}
                  HEAD_REF: ${{ github.event.pull_request.head.ref }}
              run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$HEAD_REF"
