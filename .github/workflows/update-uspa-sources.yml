name: Update USPA SCM source PDFs

on:
    schedule:
        - cron: '41 5 28 * *' # 28th at 05:41 UTC (end of month - latest day every month has - so a mid-month revision is caught the same month)
    workflow_dispatch:

jobs:
    check:
        runs-on: ubuntu-latest
        permissions:
            contents: read # for checkout
        outputs:
            changed: ${{ steps.fetch.outputs.changed }}
            failed: ${{ steps.fetch.outputs.failed }}
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-python@v6
              with:
                  python-version: '3.12'

            # Discovers each chapter's download URL live from the SCM page by name
            # (no pinnable URL - see fetch_uspa.py), fetches it, diffs the committed copy.
            - name: Discover and fetch SCM chapter PDFs
              id: fetch
              run: |
                  mkdir -p "$RUNNER_TEMP/staged"
                  python3 tools/uspa-extract/fetch_uspa.py --out-dir "$RUNNER_TEMP/staged" | tee "$RUNNER_TEMP/report.json"

                  {
                      echo "changed=$(jq -c '.changed' "$RUNNER_TEMP/report.json")"
                      echo "failed=$(jq -r '.failed' "$RUNNER_TEMP/report.json")"
                  } >> "$GITHUB_OUTPUT"
                  {
                      echo "### USPA SCM source check"
                      jq -r '.setupError // empty | select(.) | "Setup error: " + .' "$RUNNER_TEMP/report.json"
                      jq -r '.details | to_entries[] | "- `\(.key)`: \(.value.status)" + (if .value.note then " - " + .value.note else "" end)' "$RUNNER_TEMP/report.json"
                  } >> "$GITHUB_STEP_SUMMARY"

            # Stash report + changed bytes so the pr job commits exactly what was compared
            - name: Stash report
              uses: actions/upload-artifact@v7
              with:
                  name: uspa-report
                  path: ${{ runner.temp }}/report.json

            - name: Stash changed PDFs for the pr job
              if: steps.fetch.outputs.changed != '[]'
              uses: actions/upload-artifact@v7
              with:
                  name: changed-pdfs
                  path: ${{ runner.temp }}/staged

    pr:
        needs: check
        if: needs.check.outputs.changed != '[]'
        runs-on: ubuntu-latest
        permissions:
            contents: write # for PR
            pull-requests: write # for PR
        steps:
            - uses: actions/checkout@v5

            - name: Restore the changed PDFs and report
              uses: actions/download-artifact@v7
              with:
                  merge-multiple: true # changed-pdfs + uspa-report into one dir
                  path: ${{ runner.temp }}/staged

            - name: Install poppler
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends poppler-utils

            - name: Archive the editions, log the revision, place the PDFs
              id: meta
              env:
                  CHANGED: ${{ needs.check.outputs.changed }}
              run: |
                  mapfile -t paths < <(jq -r '.[]' <<<"$CHANGED")

                  # Archive the fetched edition into legacy/<fetch year>/, so the archive keeps one
                  # copy per edition (this current one included) - a same-year re-revision nests by
                  # fetch month (<year>/<Month>/) beside the flat copy - legacy/** captures both
                  pairs=()
                  for path in "${paths[@]}"; do
                      pairs+=("$path" "$(python3 tools/legacy_archive.py archive-pdf "$RUNNER_TEMP/staged/$(basename "$path")" assets/sources/uspa/legacy)")
                  done

                  # Log runs while the committed PDFs are still the editions being replaced
                  {
                      echo "Upstream revision of the watched USPA SCM chapters, also logged at the top of \`assets/sources/uspa/legacy/README.md\`. Merging starts the automatic image re-cut, which opens a review PR."
                      echo
                      python3 tools/uspa-extract/log_revision.py "${pairs[@]}"
                      echo
                      echo '<details>'
                      echo '<summary>Discovered from the live USPA SCM file library</summary>'
                      echo
                      echo '```json'
                      jq .details "$RUNNER_TEMP/staged/report.json"
                      echo '```'
                      echo
                      echo '</details>'
                  } > "$RUNNER_TEMP/pr-body.md"
                  echo "month=$(grep -m1 '^## ' "$RUNNER_TEMP/pr-body.md" | cut -c4-)" >> "$GITHUB_OUTPUT"

                  # The check job already fetched and compared these exact bytes, just place them
                  for path in "${paths[@]}"; do
                      cp "$RUNNER_TEMP/staged/$(basename "$path")" "$path"
                  done

            - name: Open PR for the updated PDFs
              uses: peter-evans/create-pull-request@v8
              with:
                  add-paths: |
                      assets/sources/uspa/*.pdf
                      assets/sources/uspa/legacy/**
                  commit-message: 'chore: Update USPA SCM PDFs to ${{ steps.meta.outputs.month }}'
                  branch: update-source-pdf/uspa
                  title: 'Update USPA SCM PDFs to ${{ steps.meta.outputs.month }}'
                  body-path: ${{ runner.temp }}/pr-body.md
                  reviewers: Andrewvlad
                  delete-branch: true

    report-failures:
        needs: check
        if: needs.check.outputs.failed == 'true'
        runs-on: ubuntu-latest
        permissions: {} # Clear permissions
        steps:
            - name: Fail on fetch errors
              run: |
                  echo 'One or more chapters failed to fetch or discover, see check job summary.'
                  exit 1
