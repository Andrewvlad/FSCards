name: Extract USPA image set

on:
    push:
        branches: [main]
        paths: ['assets/sources/uspa/*.pdf'] # Only fires when an updated SCM chapter is merged
    workflow_dispatch:
        inputs:
            pdfs:
                description: 'Space-separated SCM PDFs (fs.pdf, collegiate.pdf) to extract (blank = all)'
                default: ''

permissions:
    contents: write
    pull-requests: write

jobs:
    extract:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 2 # Fetch HEAD + parent for the PDF diff

            - uses: actions/setup-python@v6
              with:
                  python-version: '3.12'

            - name: Install Python dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends poppler-utils
                  pip install numpy pillow scipy

            - name: Extract embedded diagrams from updated chapter
              id: extract
              env:
                  PDFS: ${{ github.event.inputs.pdfs }}
              run: |
                  # merge commit's HEAD^ is pre-merge main, so the diff is the whole PR.
                  # Manual dispatch re-cuts the PDFs input (blank = both chapters)
                  if [ "$GITHUB_EVENT_NAME" = "push" ]; then
                      changed=$(git diff --name-only HEAD^ HEAD -- 'assets/sources/uspa/*.pdf' | xargs -rn1 basename)
                  else
                      changed="${PDFS:-fs.pdf collegiate.pdf}"
                  fi
                  echo "changed PDFs: ${changed:-none}"
                  # Empty only on a linear push touching no SCM PDF - skip, install.py no-ops, no spurious PR
                  if [ -n "$changed" ]; then
                      python3 tools/uspa-extract/extract.py $changed | tee "$RUNNER_TEMP/extract.log"
                      # Branch suffix = re-cut chapters, so concurrent runs land on independent branches/PRs
                      slug=$(grep '^recut-slug:' "$RUNNER_TEMP/extract.log" | cut -d' ' -f2- | tr ' ' '-' || true)
                  fi
                  echo "slug=${slug:-all}" >> "$GITHUB_OUTPUT"

            - name: Commit changed diagram(s)
              id: commit
              run: |
                  python3 tools/uspa-extract/install.py | tee "$RUNNER_TEMP/install.log"
                  # Status + path list feeds the comparison comment after the PR exists
                  changed=$(git status --porcelain -- 'assets/diagrams/*/USPA/*' | tee "$RUNNER_TEMP/changed-images.txt")
                  echo "changed=$([ -n "$changed" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
                  # Changed disciplines (3rd path segment) scope the panel-cut re-measure
                  echo "disciplines=$(echo "$changed" | cut -c4- | cut -d/ -f3 | sort -u | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
                  # Staged image paths (status prefix stripped) scope thumbnail regen to just the changed keys
                  echo "images=$(echo "$changed" | cut -c4- | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
                  {
                      echo '### USPA re-cut'
                      tail -1 "$RUNNER_TEMP/install.log"
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Validate pool ordering
              if: steps.commit.outputs.changed == 'true'
              run: |
                  # Post-install, so it sees exactly the sets the PR proposes (after PROTECT/orphan-delete).
                  # tee+|| true keeps a warning non-blocking, so the PR still opens with the warning shown
                  python3 tools/validate_ordering.py ${{ steps.commit.outputs.disciplines }} | tee "$RUNNER_TEMP/ordering.log" || true

            - name: Measure panel cuts (for tri-panel splitting)
              id: measure
              if: steps.commit.outputs.changed == 'true'
              run: |
                  python3 tools/panel-cuts/measure.py ${{ steps.commit.outputs.disciplines }}
                  # Audit sheets exist only when a cut moved, i.e. panel-cuts.js changed
                  echo "cuts=$(git status --porcelain -- assets/diagrams/panel-cuts.js | grep -q . && echo true || echo false)" >> "$GITHUB_OUTPUT"

            # Using artifacts rather than creating orphan branches to host the images
            - name: Upload audit sheets for review
              id: audit
              if: steps.measure.outputs.cuts == 'true'
              uses: actions/upload-artifact@v7
              with:
                  name: panel-cut-audit-sheets
                  path: tools/panel-cuts/audit-*.png

            - name: Generate diagram thumbnails
              if: steps.commit.outputs.changed == 'true'
              run: python3 tools/thumbnails/generate.py ${{ steps.commit.outputs.images }}

            - name: Regenerate image manifests
              if: steps.commit.outputs.changed == 'true'
              run: python3 tools/manifest/generate.py ${{ steps.commit.outputs.images }}

            - name: Compose PR body
              if: steps.commit.outputs.changed == 'true'
              env:
                  CUTS_CHANGED: ${{ steps.measure.outputs.cuts }}
                  AUDIT_URL: ${{ steps.audit.outputs['artifact-url'] }}
              run: |
                  body="$RUNNER_TEMP/pr-body.md"
                  {
                      echo 'USPA SCM source chapter changed, triggering a re-extraction of the embedded diagrams. Noticeable changes added for review.'
                      echo
                      echo '### Extraction summary'
                      echo '```'
                      cat "$RUNNER_TEMP/install.log"
                      echo '```'
                      echo
                      echo '### Ordering check'
                      echo 'Randoms run A.. (FS skip I, CF with I), blocks 1..N. A warning flags a mis-cut key or a reordered edition.'
                      echo '```'
                      grep '\[ordering\]' "$RUNNER_TEMP/ordering.log" || echo '(ordering-check output unavailable)'
                      echo '```'
                      echo
                      echo 'The 4-way `R`/Bundy card is CISM-only, absent from the SCM, so it is never re-cut and stays as shipped. The 8-way `D`/Hope Diamond hand graft re-proposes on a re-cut - `/reject D` to keep it. The re-cut is **not** auto-merged: verify the diagrams, reject what you do not want, or re-run `driver_ch9.py` / `driver_ch7.py` by hand for a deeper re-cut.'
                      if [ "$CUTS_CHANGED" = 'true' ]; then
                          echo
                          echo "Panel cuts updated, review the [audit sheet]($AUDIT_URL)."
                      fi
                  } > "$body"

            - name: Open PR with re-cut sets
              id: pr
              if: steps.commit.outputs.changed == 'true'
              uses: peter-evans/create-pull-request@v8
              with:
                  add-paths: |
                      assets/diagrams/**
                      assets/sources/uspa/legacy/deprecated/**
                  commit-message: 'chore: Update USPA ${{ steps.extract.outputs.slug }} image set'
                  branch: extract-image-set/uspa/${{ steps.extract.outputs.slug }}
                  title: 'Extract updated USPA ${{ steps.extract.outputs.slug }} image set'
                  body-path: ${{ runner.temp }}/pr-body.md
                  reviewers: Andrewvlad
                  delete-branch: true

            - name: Comment showing old vs new images
              if: steps.commit.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
                  HEAD_SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
              run: |
                  # webp gets no rich diff in Files changed, so embed SHA-pinned raw images for review
                  body="$RUNNER_TEMP/compare.md"
                  raw="https://raw.githubusercontent.com/$GITHUB_REPOSITORY"
                  # Pool order per discipline: randoms A-Z, then blocks numerically, with diagrams followed by their respective figures
                  awk '{
                      n = split($NF, seg, "/")
                      key = seg[n]; sub(/\.webp$/, "", key)
                      printf "%s\t%d\t%d\t%s\t%d\t%s\n", seg[3], (key ~ /^[0-9]/), key + 0, key, (seg[n - 1] == "figures"), $0
                  }' "$RUNNER_TEMP/changed-images.txt" | sort -t$'\t' -k1,1 -k2,2n -k3,3n -k4,4 -k5,5n | cut -f6- > "$RUNNER_TEMP/sorted-images.txt"
                  {
                      echo '<!--uspa-compare-->'
                      echo "Changed images below. Reject with a \`/reject <keys>\` comment (e.g. \`/reject 13 G:diagram D:figure\`)."
                      echo
                      echo '| File | Current | Incoming |'
                      echo '| ---- | ------- | -------- |'
                      n=0
                      while read -r status path; do
                          n=$((n + 1))
                          [ $n -gt 120 ] && continue # Stay under the 65536-char comment cap
                          old="<img src=\"$raw/$GITHUB_SHA/$path\" width=\"300\">"
                          new="<img src=\"$raw/$HEAD_SHA/$path\" width=\"300\">"
                          case "$status" in
                              '??') old='*(new key)*';;
                              D) new='*(dropped key)*';;
                          esac
                          echo "| \`${path#assets/diagrams/}\` | $old | $new |"
                      done < "$RUNNER_TEMP/sorted-images.txt"
                  } > "$body"
                  if [ $n -gt 120 ]; then echo "| *($((n - 120)) more files not shown)* | | |" >> "$body"; fi
                  # One live comparison comment per PR, re-runs replace it
                  gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
                      --jq '.[] | select(.body | startswith("<!--uspa-compare-->")) | .id' |
                      xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/{}"
                  gh pr comment "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --body-file "$body"
