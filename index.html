<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Learn the formation skydiving dive pool using flashcards, gallery, and quiz views">
    <meta name="author" content="Andrew Vladelshchikov">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSCards</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#0d0d0f">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eeeeec">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
    <script>
        // Resolve the active theme before first paint
        let savedTheme;
        try { savedTheme = localStorage.getItem('fscards-theme'); } catch (e) {} // Storage may be unavailable
        document.documentElement.dataset.theme =
            savedTheme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    </script>
    <!--Standalone styles - the shared sheet carries no landing rules, like 404.html-->
    <style>
        :root {
            --bg: #0d0d0f;
            --border: #2a2a35;
            --accent: #f0c040;
            --text: #f0ede8;
            --muted: #7a7a8a;
            --blackText: #0d0d0f;
        }
        :root[data-theme="light"] {
            --bg: #eeeeec;
            --border: #d6d2c8;
            --text: #1c1b19;
        }
        * {
            /* Include borders for all measurements */
            box-sizing: border-box;
            margin: 0;
            padding: 0;

            /* Disable all highlighting/selection */
            user-select: none;
            -webkit-tap-highlight-color: transparent; /* Kill the blue tap flash on touch */
        }
        body {
            min-height: 100dvh;
            display: grid;
            grid-template-rows: 1fr auto;  /* Center main in the top space, pin the footer to the bottom */
            place-items: center;
            padding: 2rem;
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Mono', monospace;
            text-align: center;
        }
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: clamp(2.4rem, 12vmin, 3.6rem);

            span {
                display: inline-block;
                color: var(--accent);
                transform-origin: 50% 50% -0.55em;  /* Pivot behind the text so it rolls on a cylinder, not flips on its midline */
            }
        }
        #tagline {
            margin-top: 0.6rem;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--muted);
        }
        nav {
            margin-top: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: min(20rem, 80vw);
        }
        nav a {
            padding: 0.95rem 1rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            transition: all 0.2s;

            &:hover {
                background: var(--accent);
                border-color: var(--accent);
                color: var(--blackText);
            }
        }
        /* Color theme toggle */
        #themeToggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            width: 2.5rem;
            height: 2.5rem;
            display: grid;
            place-items: center;
            border: 1px solid var(--border);
            border-radius: 50px;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;

            /* Light up on press (touch + mouse), releasing on lift so it never sticks */
            &:active {
                background: var(--accent);
                border-color: var(--accent);
                color: var(--blackText);
            }

            /* Gate hover to real-pointer devices so a tap doesn't leave it stuck/highlighted on touch/focus */
            @media (hover: hover) {
                &:hover {
                    background: var(--accent);
                    border-color: var(--accent);
                    color: var(--blackText);
                }
            }
            svg {
                display: none;
                width: 1.1rem;
                height: 1.1rem;
            }
        }
        /* Show the icon of the theme the tap switches to */
        :root[data-theme="dark"] #themeToggle .sun {display: block}
        :root[data-theme="light"] #themeToggle .moon {display: block}
        /* Social footer */
        footer {
            display: flex;
            gap: 1rem;
        }
        footer a {
            padding: 0.35rem;  /* Bigger tap target than the bare icon */
            color: var(--muted);
            transition: color 0.2s;

            /* Press feedback + pointer-only hover, same touch lesson as the toggle */
            &:active {color: var(--accent)}
            @media (hover: hover) {
                &:hover {color: var(--accent)}
            }
            svg {
                display: block;
                width: 1.3rem;
                height: 1.3rem;
                overflow: visible;  /* Brand glyphs touch x=24, so the SVG viewport clips the last column without this */
            }
        }
    </style>
</head>
<body>
<button id="themeToggle" type="button" aria-label="Toggle dark mode" onclick="toggleTheme()">

</button>

<script>
    // Hovering a view button rolls the wordmark's gold span to that view's word on a cylinder reel.
    // One rAF loop drives a single progress p, so a hover can reverse or retarget the roll mid-flight.
    const reel = document.querySelector('h1 span');
    const defaultWord = reel.textContent;
    const ROLL = 150; // ms per half-turn (roll the current word out, then the next in)
    const dirOf = word => word === defaultWord ? -1 : 1; // Views roll up, the default rolls back down
    let shown = defaultWord; // word currently painted
    let pending = defaultWord; // latest hovered target
    let roll = null; // active transition, or null at rest
    let running = false, last = 0;

    // Width of a word at the reel's font, read by swapping the text in place
    function wordWidth(word) {
        const text = reel.textContent, width = reel.style.width;
        reel.style.width = 'auto';
        reel.textContent = word;
        const px = reel.offsetWidth;
        reel.textContent = text;
        reel.style.width = width;
        return px;
    }

    function frame(now) {
        const dt = now - (last || now);
        last = now;

        if (!roll && pending !== shown)
            roll = {a: shown, b: pending, dir: dirOf(pending), p: 0, goal: 1,
                    wa: wordWidth(shown), wb: wordWidth(pending)};

        if (roll) {
            // Steer the in-flight roll at the latest hover: drive toward whichever end it wants
            if (pending === roll.b) roll.goal = 1;
            else if (pending === roll.a) roll.goal = 0; // Reverse straight back the way it came
            else if (roll.p < 0.5) { // Retarget before the next word shows
                roll.b = pending; roll.wb = wordWidth(pending); roll.goal = 1;
            } // A third word after the swap rides out, then chains below

            roll.p = Math.max(0, Math.min(1, roll.p + (roll.goal ? 1 : -1) * dt / (2 * ROLL)));

            const front = roll.p < 0.5; // Outgoing half (a) shown, vs incoming (b)
            const word = front ? roll.a : roll.b;
            if (reel.textContent !== word) reel.textContent = word; // Swap while edge-on and invisible
            reel.style.width = `${roll.wa + (roll.wb - roll.wa) * roll.p}px`; // Glide width across the roll so FS slides, not jumps
            const vis = Math.abs(2 * roll.p - 1); // 1 at rest, 0 edge-on
            reel.style.transform = `rotateX(${roll.dir * 180 * (front ? roll.p : roll.p - 1)}deg)`;
            reel.style.opacity = vis;
            reel.style.filter = `brightness(${0.5 + 0.5 * vis})`;

            if (roll.p === roll.goal) { // Settled at the end it was driving toward
                shown = word;
                reel.style.width = reel.style.transform = reel.style.opacity = reel.style.filter = '';
                roll = null;
            }
        }

        if (roll || pending !== shown) requestAnimationFrame(frame);
        else { running = false; last = 0; }
    }

    function start() {
        if (running) return;
        running = true;
        requestAnimationFrame(frame);
    }

    // Track hover on the nav, not each button, so crossing the gaps doesn't bounce through the default
    const nav = document.querySelector('nav');
    nav.querySelectorAll('a').forEach(a =>
        a.addEventListener('mouseenter', () => { pending = a.dataset.word; start(); }));
    nav.addEventListener('mouseleave', () => { pending = defaultWord; start(); });
</script>
<!--Toggle theme-->
<script>
    function toggleTheme() {
        const theme = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        try { localStorage.setItem('fscards-theme', theme); } catch (e) {} // Storage may be unavailable
    }
</script>
</body>
