<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <base href="../">
    <meta name="description" content="Formation skydiving dive pool diagrams">
    <meta name="author" content="Andrew Vladelshchikov">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSCards - Diagram Gallery</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@700&family=Playfair+Display:wght@700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="stylesheet.css">
    <script>
        // Resolve the active theme before first paint
        let savedTheme;
        try { savedTheme = localStorage.getItem('fscards-theme'); } catch (e) {} // Storage may be unavailable
        document.documentElement.dataset.theme =
            savedTheme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    </script>
</head>
<body class="gallery">

<!--Floating corner buttons (bottom-left, stacked): diagram-source logo on top, report-issue below-->
<div id="cornerButtons">
    <!--Diagram source: links to the active image set's source site; href/icon set by updateSourceButton()-->
    <a id="sourceLink" target="_blank" rel="noopener noreferrer"></a>
    <!--Report issue: repo's new-issue page, prefilled with current state-->
    <a id="reportIssue" href="https://github.com/Andrewvlad/FSCards/issues/new" target="_blank" rel="noopener noreferrer" title="Report an issue on GitHub" aria-label="Report an issue on GitHub" onclick="this.href = buildIssueUrl()">
        <svg viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 21V4"/>
            <path d="M5 4h13l-2.5 4 2.5 4H5"/>
        </svg>
    </a>
</div>

<!--Content-->
<header>
    <div id="headerTitle">
        <!--The logo doubles as a view switcher-->
        <details id="viewSwitch">
            <summary id="logo"><a href="./" aria-label="FSCards home">FS</a><span>Gallery</span><svg class="switchCaret" viewBox="0 0 12 12" width="13" height="13" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M2.5 4.5 6 8l3.5-3.5"/></svg></summary>
            <nav class="viewMenu" aria-label="Switch view">
                <a href="cards/"><strong>Flashcards</strong></a>
                <a href="quiz/"><strong>Quiz</strong></a>
                <a href="gallery/" aria-current="page"><strong>Gallery</strong></a>
            </nav>
        </details>
        <div id="tagline">Learn the skydiving formation dive pool</div>
    </div>
    <button id="settingsToggle" class="pill" onclick="toggleSettings()"><span class="cog">⚙</span>Settings</button>
</header>

<div id="settingsPanel" class="hidden">
    <div class="settingsGroup" id="categoryGroup">
        <div class="settingsLabel"><span>Category</span></div>
        <div class="segmented" id="categorySegment">
            <button type="button" data-category="randoms" class="pill" onclick="selectCategory(this)">Randoms</button>
            <button type="button" data-category="blocks" class="pill" onclick="selectCategory(this)">Blocks</button>
            <button type="button" data-category="all" class="pill active" onclick="selectCategory(this)">All</button>
        </div>
    </div>

    <div class="settingsGroup" id="classGroup">
        <div class="settingsLabel"><span>Class</span></div>
        <div class="segmented" id="classSegment"></div>
    </div>

    <div class="settingsGroup" id="imageSetGroup">
        <div class="settingsLabel"><span>Diagram Set</span></div>
        <div class="segmented" id="imageSetSegment"></div>
    </div>

    <div class="toggleGroup">
        <label class="toggleSetting hidden" id="indoorSetting">
            <input type="checkbox" id="indoorToggle" onchange="selectIndoor(this)">
            <span class="toggle"></span>
            Indoor diagrams
        </label>

        <label class="toggleSetting hidden" id="tunnelSetting">
            <input type="checkbox" id="tunnelToggle" onchange="selectTunnel(this)">
            <span class="toggle"></span>
            12-Foot Tunnel
        </label>

        <div class="toggleRow hidden" id="fusionsSetting">
            <label class="toggleSetting">
                <input type="checkbox" id="fusionsToggle" checked onchange="selectFusions(this)">
                <span class="toggle"></span>
                Include Fusions
            </label>
            <button type="button" class="infoTip" aria-label="About Fusions and Singles" aria-describedby="fusionsTip">
                <svg class="infoIcon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
                    <circle cx="8" cy="8" r="6.6"/>
                    <line x1="8" y1="7.2" x2="8" y2="11.4" stroke-linecap="round"/>
                    <circle cx="8" cy="4.7" r="0.55" fill="currentColor" stroke="none"/>
                </svg>
                <span class="tipBubble" id="fusionsTip" role="tooltip">Not all Fusions & Singles have posted diagrams</span>
            </button>
        </div>

        <label class="toggleSetting">
            <input type="checkbox" id="themeToggle" onchange="selectTheme(this)">
            <span class="toggle"></span>
            Light mode
        </label>

        <label class="toggleSetting hidden" id="invertSetting">
            <input type="checkbox" id="invertToggle" checked onchange="selectInvert(this)">
            <span class="toggle"></span>
            Invert colors
        </label>
    </div>
</div>

<div id="modeBar">
    <button data-mode="2-way" class="pill">2-Way</button>
    <button data-mode="4-way" class="pill active">4-Way</button>
    <button data-mode="6-way-speed" class="pill">6-Way Speed</button>
    <button data-mode="8-way" class="pill">8-Way</button>
    <button data-mode="10-way-speed" class="pill">10-Way Speed</button>
    <button data-mode="16-way" class="pill">16-Way</button>
    <button data-mode="2-way-vfs" class="pill">VFS 2-Way</button>
    <button data-mode="4-way-vfs" class="pill">VFS 4-Way</button>
    <button data-mode="2-way-mfs" class="pill">MFS 2-Way</button>
    <button data-mode="2-way-cf" class="pill">CF 2-Way</button>
    <button data-mode="4-way-cf" class="pill">CF 4-Way</button>
    <button data-mode="cp-freestyle" class="pill">CP Freestyle</button>
    <!--Replaces buttons to fit width-->
    <select id="modeSelect" class="pill modeDropdown" aria-label="Discipline"></select>
    <!--Toggle the diagram layout between grid and carousel-->
    <button type="button" id="viewToggle" class="pill" aria-pressed="false" onclick="toggleView()">Carousel</button>
</div>

<div id="gallery"></div>
<div id="galleryCarousel" class="hidden"></div>


<!--Per-discipline info-->
<script src="assets/diagrams/2-way/index.js"></script>
<script src="assets/diagrams/4-way/index.js"></script>
<script src="assets/diagrams/6-way-speed/index.js"></script>
<script src="assets/diagrams/8-way/index.js"></script>
<script src="assets/diagrams/10-way-speed/index.js"></script>
<script src="assets/diagrams/16-way/index.js"></script>
<script src="assets/diagrams/2-way-vfs/index.js"></script>
<script src="assets/diagrams/4-way-vfs/index.js"></script>
<script src="assets/diagrams/2-way-mfs/index.js"></script>
<script src="assets/diagrams/2-way-cf/index.js"></script>
<script src="assets/diagrams/4-way-cf/index.js"></script>
<script src="assets/diagrams/cp-freestyle/index.js"></script>

<script src="index.js"></script>
<script src="shared.js"></script>
<!--Page state-->
<script>
    const poolSettings = () => ({discipline, indoor, imageSet, classLevel, tunnel, includeFusions});
</script>
<!--Save filters-->
<script>
    function saveSession() {
        saveShared({discipline, category, classLevel, indoor, tunnel, includeFusions, imageSet, invert});
    }

    function loadSession() {
        const data = loadShared();
        if (data) applySharedFilters(data);
    }
</script>
<!--Build the diagram grid-->
<script>
    const gallery = document.getElementById('gallery');
    const galleryCarousel = document.getElementById('galleryCarousel');
    const viewToggle = document.getElementById('viewToggle');
    const VIEW_KEY = 'fscards-gallery-view'; // Remember layout choice
    let carouselView = loadView();
    function loadView() {
        try { return localStorage.getItem(VIEW_KEY) === 'carousel'; } catch (e) { return false; } // Storage may be unavailable
    }
    function saveView() {
        try { localStorage.setItem(VIEW_KEY, carouselView ? 'carousel' : 'grid'); } catch (e) {} // Storage may be unavailable
    }

    const byKey = (a, b) => keyOrder(a.key, b.key);

    // The pool formations in display order, category filter applied (uncategorized pools show everything)
    function galleryFormations() {
        const pool = Object.values(buildPool(poolSettings()));
        return (categorized(poolSettings()) ? pool.filter(matchesCategory) : pool).sort(byKey);
    }

    function renderGrid() {
        const captioned = includeCaption(discipline);
        gallery.innerHTML = galleryFormations().map(formation => {
            const diagram = `<img ${lazySrc(formation.image)} alt="${formation.name}" loading="lazy">`;
            const media = formation.video
                ? `<a href="${formation.video}" target="_blank" rel="noopener noreferrer">${diagram}</a>`
                : diagram;
            return captioned
                ? `<figure>${media}<figcaption>${formation.name}</figcaption></figure>`
                : media;
        }).join('');
    }

    function renderCarousel() {
        const items = galleryFormations().map(card => ({card}));
        galleryCarousel.innerHTML = carouselMarkup(items);
        initCarousel(items);
    }

    // Render the active layout, clearing the other (a cleared carousel stops its drift loop)
    function renderView() {
        viewToggle.classList.toggle('active', carouselView);
        viewToggle.setAttribute('aria-pressed', carouselView);
        gallery.classList.toggle('hidden', carouselView);
        galleryCarousel.classList.toggle('hidden', !carouselView);
        if (carouselView) {
            gallery.innerHTML = ''; renderCarousel();
        } else {
            galleryCarousel.innerHTML = ''; renderGrid();
        }
    }

    function toggleView() {
        carouselView = !carouselView;
        saveView();
        renderView();
    }
</script>
<!--Filter hooks: every change re-renders the active layout and mirrors the filters-->
<script>
    function poolChanged() {
        renderView();
        saveSession();
    }

    function disciplineChanged() {
        updateDisciplineUI();
        poolChanged();
    }

    const categoryChanged = poolChanged;
    const imagesChanged = poolChanged;
</script>
<!--Start-->
<script>
    loadSession();
    syncChromeUI();
    renderView();
</script>
<!--Report issue: page-specific lines for shared.js's buildIssueUrl-->
<script>
    const ISSUE_PAGE = 'Gallery';
    function issueDetails() {
        return [
            `- View: ${carouselView ? 'carousel' : 'grid'}`,
            carouselView ? `- Auto-scroll: ${driftEnabled}` : null,
        ];
    }
</script>
<noscript>To use this tool, please enable JavaScript.</noscript>

</body>
</html>
